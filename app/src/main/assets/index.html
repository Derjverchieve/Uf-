<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Chess Lab</title>
<style>
:root{
 --bg:#0a0d10;--panel:#11161a;--panel2:#171d22;--panel3:#1d252b;--line:#29333b;
 --text:#f1f4f5;--muted:#7f8c95;--accent:#7fc7a4;--accent2:#4fae86;--gold:#d7b46a;
 --light:#e8d9bb;--dark:#9c6d45;--sq:calc((min(100vw - 34px, 58vh)) / 8);
}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:radial-gradient(ellipse at 50% -10%,#172128 0,#0a0d10 48%);color:var(--text);font:14px/1.35 Inter,Roboto,system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden}button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}svg{width:20px;height:20px;display:block}
header{height:54px;display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid rgba(255,255,255,.055);background:rgba(10,13,16,.78);backdrop-filter:blur(18px);flex:none;z-index:3}
.brand{display:flex;align-items:center;gap:9px;font-size:18px;font-weight:800;letter-spacing:-.45px}.brand:before{content:'♞';width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(145deg,#26352f,#132019);border:1px solid #365144;color:var(--accent);font-size:19px}.brand span{color:var(--accent)}
.acts{display:flex;gap:5px}.acts button{width:38px;height:36px;border-radius:10px;background:#151b20;border:1px solid #222b31;display:grid;place-items:center;color:#b6c0c6;transition:.15s}.acts button:active{transform:scale(.94);background:var(--panel3);color:#fff}.acts button:last-child{color:var(--accent)}
#stage{display:flex;flex-direction:column;align-items:center;gap:7px;padding:10px 0 0;flex:none}
#evr{width:min(calc(100vw - 34px),58vh);height:28px;display:flex;align-items:center;gap:9px}
#sc{flex:none;min-width:52px;height:25px;padding:3px 8px;border-radius:7px;text-align:center;background:#edf1f2;color:#0c1114;font:800 12px/19px ui-monospace,SFMono-Regular,monospace;box-shadow:0 1px 8px rgba(0,0,0,.25)}
#sc.neg{background:#283036;color:#eef2f3}#eb{height:6px;flex:1;border-radius:99px;background:#283137;overflow:hidden;box-shadow:inset 0 1px 2px #07090a}#eb i{display:block;height:100%;width:50%;background:linear-gradient(90deg,#f2f4f4,#cdd3d6);transition:width .3s;border-radius:99px}#dp{min-width:27px;text-align:right;color:#65737d;font:10px ui-monospace,monospace}
#bd{width:min(calc(100vw - 34px),58vh);aspect-ratio:1;display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);border-radius:5px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.48),0 0 0 1px rgba(255,255,255,.08);background:#222}
.sq{position:relative;display:grid;place-items:center;min-width:0;min-height:0}.l{background:var(--light)}.d{background:var(--dark)}
.sq:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.08),transparent 45%);opacity:.45}.sq.h::before{content:'';position:absolute;inset:0;background:rgba(238,196,71,.56);z-index:1}.sq.s::before{content:'';position:absolute;inset:0;background:rgba(93,181,143,.55);z-index:1}.sq.t:after{content:'';position:absolute;width:24%;height:24%;border-radius:50%;background:rgba(10,22,27,.34);z-index:1;inset:auto}
.sq img{width:96%;height:96%;position:relative;z-index:2;pointer-events:none;filter:drop-shadow(0 1px 1px rgba(0,0,0,.32))}.gl{font-size:min(9vw,34px);position:relative;z-index:2}.gl.w{color:#fff;text-shadow:0 1px 2px #000}
.co{position:absolute;z-index:3;font:700 9px/1 system-ui;opacity:.78;pointer-events:none}.co.r{top:4px;left:4px}.co.f{bottom:3px;right:4px}.l .co{color:#735a42}.d .co{color:#f0d7b4}
#open{width:min(calc(100vw - 42px),58vh);height:24px;padding:5px 3px 0;color:#71808a;text-align:left;font-size:11px;font-weight:600;letter-spacing:.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.card{background:linear-gradient(180deg,rgba(24,31,36,.96),rgba(16,21,25,.96));border:1px solid #263039;border-radius:14px;margin:7px 12px 0;box-shadow:0 7px 24px rgba(0,0,0,.2)}
#eng{padding:9px 11px;flex:none}.erow{display:flex;align-items:center;justify-content:space-between}.sw{display:flex;align-items:center;gap:9px;font-weight:700;font-size:13px;letter-spacing:.1px}.sw:before{content:'●';font-size:9px;color:#65727a}.sw input{display:none}.sw span{width:38px;height:22px;border-radius:99px;background:#2a3339;border:1px solid #344048;position:relative;transition:.2s;order:-1}.sw span:after{content:'';position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#9aa5aa;transition:.2s}.sw input:checked+span{background:#214d3b;border-color:#3c785d}.sw input:checked+span:after{left:19px;background:var(--accent)}
#seg{display:flex;background:#0c1013;border:1px solid #252e34;border-radius:9px;padding:2px;gap:1px}#seg button{width:27px;height:25px;border-radius:6px;color:#64727a;font:700 11px ui-monospace,monospace}#seg button.on{background:#293b34;color:#bce6d0;box-shadow:inset 0 0 0 1px #365a49}
#lines{margin-top:7px;min-height:24px}#lines div{display:flex;gap:9px;align-items:center;padding:3px 0;font-size:13px;white-space:nowrap;overflow:hidden}#lines b{flex:none;min-width:48px;text-align:center;border-radius:6px;padding:3px 4px;background:#e9edef;color:#11171a;font:800 11px ui-monospace,monospace}#lines b.neg{background:#2b343a;color:#edf1f2}#lines span{overflow:hidden;text-overflow:ellipsis;color:#adb8be;font-family:ui-monospace,SFMono-Regular,monospace;font-size:12px}.none{color:#68757d;font-size:12px!important}
#moves{flex:1;overflow:auto;padding:8px 10px;margin:7px 12px 7px;min-height:48px;line-height:1.8;scrollbar-width:none}#moves::-webkit-scrollbar{display:none}#moves a{display:inline-block;padding:2px 7px;margin:1px 0;border-radius:7px;font-size:15px;transition:.12s}#moves a i{font-style:normal;color:#68757d;font-size:11px;margin-right:4px;font-family:ui-monospace,monospace}#moves a.on{background:#29463a;color:#d9f2e5;font-weight:700;box-shadow:inset 0 0 0 1px #3d6955}#moves a.on i{color:#8bb7a1}.var{color:#69757c}.var a{font-size:13px}.hint{color:#68757d;font-size:12px;padding:3px}
#dock{display:flex;gap:7px;padding:7px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(13,17,20,.94);border-top:1px solid #252e34;flex:none;box-shadow:0 -10px 28px rgba(0,0,0,.22);backdrop-filter:blur(15px)}#dock button{height:43px;flex:1;border:1px solid #29333a;background:#151b20;border-radius:10px;display:grid;place-items:center;color:#829099}#dock button:nth-child(2),#dock button:nth-child(3){color:#c2cbd0}#dock button:active{background:#20292f;transform:scale(.97)}#dock svg{width:20px;height:20px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;z-index:9;backdrop-filter:blur(4px)}.sheet.on{display:flex}.sheet>div{width:100%;max-height:88vh;overflow:auto;background:#11171b;border:1px solid #2a353d;border-bottom:0;border-radius:22px 22px 0 0;padding:18px 16px calc(17px + env(safe-area-inset-bottom,0px));box-shadow:0 -20px 60px rgba(0,0,0,.5)}.sheet h3,.edt{margin:0 0 8px;font-size:19px;letter-spacing:-.3px}.sheet h3:after{content:'';display:block;width:28px;height:3px;margin-top:8px;border-radius:99px;background:var(--accent)}.sheet p,#edPanel p{color:#7f8b92;margin:5px 0;font-size:12px}.sheet textarea{width:100%;height:23vh;background:#0a0e11;color:#dce3e6;border:1px solid #29343b;border-radius:12px;padding:11px;font:12px ui-monospace,monospace;outline:none}.sheet textarea:focus{border-color:#4d7563}.row{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.btn{min-height:42px;padding:0 14px;border-radius:10px;background:#192126;border:1px solid #2c373e;font-weight:700;color:#bdc7cc}.btn:active{transform:scale(.98)}.btn.p{background:#356d55;border-color:#4b876a;color:#effaf4}.btn.on{background:#1e3d31;border-color:#47735d;color:#bde2cf}
#edPanel{padding:12px;flex:1;overflow:auto;margin:7px 12px}.edt{font-size:15px}#pal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:9px}#pal button{aspect-ratio:1;border-radius:9px;background:#171f24;border:1px solid #29343a;display:grid;place-items:center;font-size:19px}#pal button.on{border-color:#4d876b;background:#1d3a2f;box-shadow:inset 0 0 0 1px #315d48}#pal img{width:82%}#mini{display:grid;grid-template:repeat(8,1fr)/repeat(8,1fr);width:min(65vw,270px);aspect-ratio:1;margin:10px auto;border-radius:7px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.35)}#mini .sq img{width:100%}
#promo{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;place-items:center;z-index:10;backdrop-filter:blur(4px)}#promo.on{display:grid}#promo div{display:flex;gap:8px;background:#151c20;padding:12px;border:1px solid #2d383f;border-radius:17px;box-shadow:0 20px 50px #000}#promo button{width:62px;height:62px;border-radius:11px;background:var(--light);border:2px solid transparent}#promo button:active{border-color:var(--accent)}#promo img{width:100%}
@media (min-width:700px){#stage{padding-top:14px}#bd,#evr{width:min(56vh,620px)}#open{width:min(56vh,620px)}#eng,#moves{margin-left:auto;margin-right:auto;width:min(700px,calc(100vw - 24px))}.acts button{width:40px}}
</style></head><body>
<header><div class="brand">Chess<span>Lab</span></div>
<div class="acts"><button id="hScan" data-ic="cam" aria-label="Scan screenshot"></button><button id="hEdit" data-ic="pen" aria-label="Edit board"></button><button id="hLoad" data-ic="file" aria-label="Load FEN or PGN"></button><button id="hFlip" data-ic="flip" aria-label="Flip board"></button></div></header>
<section id="stage"><div id="evr"><b id="sc">0.0</b><div id="eb"><i></i></div><span id="dp"></span></div><div id="bd"></div></section>
<div id="open"></div>
<section id="eng" class="card"><div class="erow"><label class="sw"><input type="checkbox" id="engOn"><span></span>Engine</label><div id="seg"></div></div><div id="lines"></div></section>
<section id="moves" class="card"></section>
<section id="edPanel" class="card" style="display:none"><b class="edt">Edit board</b><p>Pick a piece, then tap squares on the board. The cross erases.</p><div id="pal"></div>
<div class="row"><button class="btn on" data-side="w">White to move</button><button class="btn" data-side="b">Black to move</button></div>
<p id="edErr" style="color:#ff8a7a"></p>
<div class="row"><button class="btn" id="edClr">Clear</button><button class="btn" id="edStart">Start</button><button class="btn" id="edCancel">Cancel</button><button class="btn p" id="edDone">Analyse</button></div></section>
<nav id="dock"><button id="b0" data-ic="first"></button><button id="b1" data-ic="prev"></button><button id="b2" data-ic="next"></button><button id="b3" data-ic="last"></button></nav>

<div class="sheet" id="shLoad"><div><h3>Load position or game</h3><textarea id="ta" placeholder="Paste a FEN or PGN"></textarea>
<div class="row"><button class="btn p" id="go">Load</button><button class="btn" id="cf">Copy FEN</button></div>
<div class="row"><button class="btn" id="del">Delete this line</button><button class="btn" id="pro">Promote this line</button><button class="btn" data-x="shLoad">Close</button></div></div></div>

<div class="sheet" id="shScan"><div><h3>Scan a screenshot</h3><p id="scMsg">Pick a screenshot or photo of a board. Everything runs on your phone.</p>
<div id="scRes" style="display:none"><div id="mini"></div><div class="row"><button class="btn on" data-sside="w">White to move</button><button class="btn" data-sside="b">Black to move</button></div>
<div class="row"><button class="btn p" id="scGo">Analyse</button><button class="btn" id="scEdit">Fix squares</button></div></div>
<div class="row"><button class="btn p" id="scPick">Choose image</button><button class="btn" data-x="shScan">Close</button></div>
<input type="file" id="scFile" accept="image/*" hidden></div></div>
<div id="promo"><div id="promoBtns"></div></div>

<script src="chess.min.js"></script><script src="scan.js"></script>
<script>
const $=s=>document.querySelector(s),$$=s=>document.querySelectorAll(s);
const START='rnbqkbnr/pppppppp/8/8/8/8/PPPPPPPP/RNBQKBNR w KQkq - 0 1',g=new Chess(),GL={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const IC={first:'M18 6l-6 6 6 6M11 6l-6 6 6 6',prev:'M15 5l-7 7 7 7',next:'M9 5l7 7-7 7',last:'M6 6l6 6-6 6M13 6l6 6-6 6',cam:'M4 8h3l2-2h6l2 2h3v11H4zM12 17a3.5 3.5 0 100-7 3.5 3.5 0 000 7z',pen:'M4 20l1-4L16 5l3 3L8 19zM13 8l3 3',file:'M7 3h7l4 4v14H7zM14 3v4h4M10 13h5M10 17h5',flip:'M7 4v14M3 14l4 4 4-4M17 20V6M13 10l4-4 4 4'};
$$('[data-ic]').forEach(e=>e.insertAdjacentHTML('afterbegin','<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="'+IC[e.dataset.ic]+'"/></svg>'));
let uid=0,byId={},root,cur,flip=false,sel=null,eng=false,mpv=3,lines=[],busy=false,pend=false,raf=0,ed=null,pro=null,scPl=null,scSide='w';
const p2a=f=>{const a=[];f.split(' ')[0].split('/').forEach((r,y)=>{let x=0;for(const c of r){if(/\d/.test(c))x+=+c;else a[y*8+x++]=c}});return a};
const a2p=a=>{let o=[];for(let y=0;y<8;y++){let s='',n=0;for(let x=0;x<8;x++){const c=a[y*8+x];if(c){if(n)s+=n;n=0;s+=c}else n++}if(n)s+=n;o.push(s)}return o.join('/')};
const pimg=p=>'<img src="pieces/'+(p===p.toUpperCase()?'w':'b')+p.toUpperCase()+'.svg" data-g="'+GL[p.toLowerCase()]+'" data-c="'+(p===p.toUpperCase()?'w':'b')+'">';
const fb=r=>r.querySelectorAll('img').forEach(i=>i.onerror=()=>{const s=document.createElement('span');s.className='gl '+i.dataset.c;s.textContent=i.dataset.g;i.replaceWith(s)});
function mk(p,san,fen,from,to){const f=p.fen.split(' '),n={id:++uid,par:p,san,fen,from,to,w:f[1]==='w',no:+f[5],kids:[]};byId[n.id]=n;if(p)p.kids.push(n);return n}
function reset(fen){uid=0;byId={};root={id:0,fen,kids:[]};byId[0]=root;go(root)}
function go(n){cur=n;sel=null;draw();tree();opening();analyse()}
function play(m){g.load(cur.fen);const r=g.move(m);if(!r)return;go(cur.kids.find(k=>k.san===r.san)||mk(cur,r.san,g.fen(),r.from,r.to))}
function sqHtml(a,o){let h='';o=o||{};for(let k=0;k<64;k++){const j=flip?63-k:k,x=j&7,y=j>>3,nm='abcdefgh'[x]+(8-y),p=a[j];
  h+='<div class="sq '+((x+y)%2?'d':'l')+(o.hl&&(nm===o.hl[0]||nm===o.hl[1])?' h':'')+(nm===o.sel?' s':'')+(o.tg&&o.tg.includes(nm)?' t':'')+'" data-q="'+nm+'">'+(p?pimg(p):'')+(o.co&&(k&7)===0?'<b class="co r">'+(8-y)+'</b>':'')+(o.co&&k>>3===7?'<b class="co f">'+'abcdefgh'[x]+'</b>':'')+'</div>'}return h}
function draw(){
  let a,o={co:1};if(ed)a=ed.sq;else{a=p2a(cur.fen);g.load(cur.fen);o.hl=[cur.from,cur.to];o.sel=sel;o.tg=sel?g.moves({square:sel,verbose:true}).map(m=>m.to):[]}
  $('#bd').innerHTML=sqHtml(a,o);fb($('#bd'));$('#eb').classList.toggle('fl',flip)}
$('#bd').onclick=e=>{
  const q=e.target.closest('.sq');if(!q)return;const n=q.dataset.q,j=(8-+n[1])*8+'abcdefgh'.indexOf(n[0]);
  if(ed){ed.sq[j]=ed.pc==='x'?null:ed.pc;return draw()}
  g.load(cur.fen);
  if(sel&&g.moves({square:sel,verbose:true}).some(m=>m.to===n)){const p=g.get(sel);if(p.type==='p'&&(n[1]==='8'||n[1]==='1')){pro={from:sel,to:n,c:p.color};$('#promoBtns').innerHTML=['q','r','b','n'].map(t=>'<button data-t="'+t+'">'+pimg(p.color==='w'?t.toUpperCase():t)+'</button>').join('');fb($('#promoBtns'));$('#promo').classList.add('on');return}return play({from:sel,to:n,promotion:'q'})}
  const p=g.get(n);sel=p&&p.color===g.turn()&&n!==sel?n:null;draw()};
$('#promoBtns').onclick=e=>{const b=e.target.closest('button');if(!b||!pro)return;$('#promo').classList.remove('on');const m=pro;pro=null;play({from:m.from,to:m.to,promotion:b.dataset.t})};
const mv=(n,f)=>'<a data-id="'+n.id+'"'+(n===cur?' class="on"':'')+'>'+(n.w?'<i>'+n.no+'.</i>':f?'<i>'+n.no+'…</i>':'')+n.san+'</a>';
function seq(p,f){if(!p.kids.length)return'';const[m,...vs]=p.kids;let h=mv(m,f);for(const v of vs)h+='<span class="var">('+mv(v,true)+seq(v,false)+')</span>';return h+seq(m,vs.length>0)}
function tree(){$('#moves').innerHTML=seq(root,true)||'<span class="hint">Tap a piece, then a square to play. Use the buttons above to scan a screenshot, edit the board, or load a FEN/PGN.</span>';const a=$('#moves .on');if(a)a.scrollIntoView({block:'nearest'})}
$('#moves').onclick=e=>{const a=e.target.closest('a');if(a)go(byId[a.dataset.id])};
let OPN={};(async()=>{for(const f of 'abcde'){try{const t=await(await fetch('openings/'+f+'.tsv')).text();t.split('\n').slice(1).forEach(l=>{const[c,n,p]=l.split('\t');if(p)OPN[p.replace(/\d+\.\s*/g,'').trim()]=c+' · '+n})}catch(e){}}opening()})();
function opening(){let h='';if(root.fen===START){const a=[];for(let n=cur;n.par;n=n.par)a.unshift(n.san);for(let i=a.length;i>0;i--){const k=a.slice(0,i).join(' ');if(OPN[k]){h=OPN[k];break}}}$('#open').textContent=h}
// engine
const send=c=>Android.send(c);
function analyse(){if(!eng||ed)return;if(busy){pend=true;send('stop')}else start()}
function start(){g.load(cur.fen);lines=[];show();if(g.game_over())return;busy=true;send('setoption name MultiPV value '+mpv);send('position fen '+cur.fen);send('go infinite')}
function onEng(l){if(l.startsWith('bestmove')){busy=false;if(pend){pend=false;start()}return}
  if(!busy)return;const m=/depth (\d+).*?multipv (\d+) score (cp|mate) (-?\d+).*? pv (.*)/.exec(l);if(!m)return;
  lines[m[2]-1]={d:+m[1],t:m[3],v:+m[4],pv:m[5].split(' ')};if(!raf)raf=requestAnimationFrame(()=>{raf=0;show()})}
const sgn=()=>cur.fen.split(' ')[1]==='w'?1:-1;
function fmt(L){const v=L.v*sgn();return L.t==='mate'?(v>0?'+M':'-M')+Math.abs(L.v):(v>0?'+':'')+(v/100).toFixed(1)}
function show(){const t=new Chess();let h='';
  lines.forEach(L=>{if(!L)return;t.load(cur.fen);const o=[];for(const u of L.pv.slice(0,8)){const m=t.move({from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]});if(!m)break;o.push(m.san)}h+='<div><b class="'+(L.v*sgn()<0?'neg':'')+'">'+fmt(L)+'</b><span>'+o.join(' ')+'</span></div>'});
  $('#lines').innerHTML=h||'<div class="none">'+(eng?'Thinking…':'Engine is off')+'</div>';
  const L=lines[0];if(L){const v=L.v*sgn(),e=$('#sc');$('#eb i').style.width=(L.t==='mate'?(v>0?100:0):50+50*(2/(1+Math.exp(-.004*v))-1))+'%';e.textContent=fmt(L);e.className=v<0?'neg':'';$('#dp').textContent='d'+L.d}else{$('#eb i').style.width='50%';$('#sc').textContent='0.0';$('#sc').className='';$('#dp').textContent=''}}
$('#engOn').onchange=e=>{eng=e.target.checked;if(eng)analyse();else{send('stop');lines=[];show()}};
$('#seg').innerHTML=[1,2,3,4,5].map(n=>'<button data-n="'+n+'"'+(n===mpv?' class="on"':'')+'>'+n+'</button>').join('');
$('#seg').onclick=e=>{const b=e.target.closest('button');if(!b)return;mpv=+b.dataset.n;$$('#seg button').forEach(x=>x.classList.toggle('on',x===b));analyse()};
// nav + sheets
$('#hFlip').onclick=()=>{flip=!flip;draw()};
$('#b0').onclick=()=>go(root);$('#b1').onclick=()=>cur.par&&go(cur.par);$('#b2').onclick=()=>cur.kids[0]&&go(cur.kids[0]);$('#b3').onclick=()=>{let n=cur;while(n.kids[0])n=n.kids[0];go(n)};
const open=id=>$('#'+id).classList.add('on'),close=id=>$('#'+id).classList.remove('on');
$$('[data-x]').forEach(b=>b.onclick=()=>close(b.dataset.x));$$('.sheet').forEach(s=>s.onclick=e=>{if(e.target===s&&s.id!=='shEdit')s.classList.remove('on')});
$('#hLoad').onclick=()=>open('shLoad');$('#cf').onclick=()=>Android.copy(cur.fen);
$('#del').onclick=()=>{if(!cur.par)return;const p=cur.par;p.kids=p.kids.filter(k=>k!==cur);go(p);close('shLoad')};
$('#pro').onclick=()=>{if(!cur.par)return;const p=cur.par;p.kids=[cur,...p.kids.filter(k=>k!==cur)];tree();close('shLoad')};
$('#go').onclick=()=>{const t=$('#ta').value.trim();if(!t)return;const c=new Chess();
  if(!/[\[\d]\./.test(t)&&c.load(t))reset(c.fen());
  else if(c.load_pgn(t)){const h=c.history({verbose:true}),f=c.header().FEN||START,r=new Chess(f);reset(f);let n=root;for(const m of h){r.move(m.san);n=mk(n,m.san,r.fen(),m.from,m.to)}go(root)}
  else{$('#ta').value='';$('#ta').placeholder='Could not read that. Paste a FEN or PGN.';return}
  close('shLoad')};
// editor
function editUI(on){$('#edPanel').style.display=on?'block':'none';$('#eng').style.display=$('#moves').style.display=$('#dock').style.display=on?'none':''}
const castle=a=>{let c='';if(a[60]==='K'){if(a[63]==='R')c+='K';if(a[56]==='R')c+='Q'}if(a[4]==='k'){if(a[7]==='r')c+='k';if(a[0]==='r')c+='q'}return c||'-'};
function openEdit(a,side){ed={sq:a.slice(),pc:'P',side:side||'w'};$('#pal').innerHTML='KQRBNPx'.split('').concat('kqrbnp'.split('')).map(p=>p==='x'?'<button data-p="x">✕</button>':'<button data-p="'+p+'">'+pimg(p)+'</button>').join('');fb($('#pal'));
  $$('#pal button').forEach(b=>b.classList.toggle('on',b.dataset.p===ed.pc));$$('[data-side]').forEach(b=>b.classList.toggle('on',b.dataset.side===ed.side));$('#edErr').textContent='';close('shScan');editUI(true);draw()}
$('#hEdit').onclick=()=>openEdit(p2a(cur.fen),cur.fen.split(' ')[1]);
$('#pal').onclick=e=>{const b=e.target.closest('button');if(!b)return;ed.pc=b.dataset.p;$$('#pal button').forEach(x=>x.classList.toggle('on',x===b))};
$$('[data-side]').forEach(b=>b.onclick=()=>{ed.side=b.dataset.side;$$('[data-side]').forEach(x=>x.classList.toggle('on',x===b))});
$('#edClr').onclick=()=>{ed.sq=[];draw()};$('#edStart').onclick=()=>{ed.sq=p2a(START);draw()};
$('#edCancel').onclick=()=>{ed=null;editUI(false);draw()};
$('#edDone').onclick=()=>{const f=a2p(ed.sq)+' '+ed.side+' '+castle(ed.sq)+' - 0 1',c=new Chess();if(!c.load(f)){$('#edErr').textContent='That position is not valid. Each side needs exactly one king.';return}ed=null;editUI(false);reset(f)};
// scan
$('#hScan').onclick=()=>open('shScan');$('#scPick').onclick=()=>$('#scFile').click();
$$('[data-sside]').forEach(b=>b.onclick=()=>{scSide=b.dataset.sside;$$('[data-sside]').forEach(x=>x.classList.toggle('on',x===b))});
$('#scFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;$('#scRes').style.display='none';$('#scMsg').textContent='Reading the board…';
  try{if(!window.scanImage)throw new Error('scanner is missing from this build');const r=await scanImage(f);
    if(!r){$('#scMsg').textContent='No board found in that image. Try cropping closer to the board.';return}
    scPl=r.placement;$('#mini').innerHTML=sqHtml(p2a(scPl));fb($('#mini'));$('#scRes').style.display='block';
    $('#scMsg').textContent=r.reliable?'Check the position, pick who moves, then analyse.':'Low confidence. Check every square, or use Fix squares.'}
  catch(err){$('#scMsg').textContent='Scan failed: '+err.message}};
$('#scEdit').onclick=()=>openEdit(p2a(scPl),scSide);
$('#scGo').onclick=()=>{const a=p2a(scPl),f=scPl+' '+scSide+' '+castle(a)+' - 0 1',c=new Chess();if(!c.load(f)){openEdit(a,scSide);$('#edErr').textContent='Needs fixing: each side needs one king.';return}close('shScan');reset(f)};
reset(START);show();
</script></body></html>
